<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HirED — Your readiness results</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0E2A47;
    --ink-soft:#48607f;
    --paper:#EEF4FC;
    --paper-2:#FFFFFF;
    --highlight:#FFC44D;
    --rise:#2A7DE1;
    --rise-bright:#5BA3F0;
    --line:#D3E2F4;
    --line-ink:#284b74;
    --bad:#E5484D;
    --warn:#F5A524;
    --good:#22C55E;
    --shadow:0 2px 4px rgba(22,37,61,.05), 0 20px 48px -20px rgba(22,37,61,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,sans-serif;
    font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;line-height:1.05;letter-spacing:-.018em;}
  a{color:inherit;text-decoration:none;}

  /* ---- nav ---- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(238,244,252,.9);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .nav-in{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;
    height:62px;padding:0 clamp(16px,4vw,40px);
  }
  .brand{font-family:"Fraunces",serif;font-weight:600;font-size:23px;letter-spacing:-.02em;}
  .brand .ed{position:relative;}
  .brand .ed::after{content:"";position:absolute;left:-1px;right:-1px;bottom:.08em;height:.4em;background:var(--highlight);z-index:-1;border-radius:2px;transform:scaleX(0);transform-origin:left center;animation:brandDraw .7s cubic-bezier(.2,.7,.2,1) .35s both;}
  @keyframes brandDraw{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @media (prefers-reduced-motion:reduce){.brand .ed::after{animation:none;transform:scaleX(1);}}
  .btn{
    display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;
    padding:10px 18px;border-radius:999px;border:1px solid transparent;cursor:pointer;
    transition:transform .14s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease;font-family:inherit;
  }
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink);}

  /* ---- layout ---- */
  .results-layout{
    width:100%;padding:28px clamp(16px,4vw,40px) 80px;
    display:flex;justify-content:center;
  }

  /* ---- sidebar tabs ---- */
  .rtabs{
    width:220px;flex-shrink:0;position:fixed;left:0;top:90px;
    display:flex;flex-direction:column;gap:4px;
  }
  .rtabs-head{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-soft);padding:4px 10px 10px;}
  .rtab{
    display:flex;align-items:center;gap:11px;text-align:left;font-family:inherit;
    background:transparent;border:1px solid transparent;border-radius:12px;
    padding:11px 12px;cursor:pointer;color:var(--ink-soft);font-size:14px;font-weight:600;
    transition:background .15s,border-color .15s,color .15s;width:100%;
  }
  .rtab:hover{background:rgba(42,125,225,.06);color:var(--ink);}
  .rtab.active{background:var(--paper-2);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow);}
  .rtab .rt-num{
    width:24px;height:24px;border-radius:50%;flex-shrink:0;
    display:grid;place-items:center;font-size:12px;font-weight:700;
    background:var(--line);color:var(--ink-soft);transition:background .15s,color .15s;
  }
  .rtab.active .rt-num{background:var(--rise);color:#fff;}
  .rtab.visited:not(.active) .rt-num{background:rgba(34,197,94,.16);color:var(--good);}
  .rt-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---- panel ---- */
  .rpanel{
    width:100%;max-width:680px;background:var(--paper-2);border:1px solid var(--line);
    border-radius:22px;box-shadow:var(--shadow);
    padding:34px clamp(20px,3vw,40px) 24px;
    display:flex;flex-direction:column;min-height:520px;
  }
  .rpanel-inner{flex:1;}
  .rstep-count{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:20px;}

  /* ---- breakdown two-panel wide layout ---- */
  .rpanel--wide{
    max-width:min(1140px,calc(100vw - 244px));
    height:calc(100vh - 62px - 56px);
    min-height:0;
  }
  .rpanel--wide .rpanel-inner{
    overflow:hidden;display:flex;flex-direction:column;min-height:0;
  }
  .rpanel--wide .rpanel-inner > .rsec{
    flex:1;min-height:0;display:flex;flex-direction:column;
  }
  .bd-split{
    flex:1;min-height:0;display:flex;gap:20px;overflow:hidden;
  }
  .bd-left{
    width:45%;flex-shrink:0;overflow-y:auto;padding-right:6px;
  }
  .bd-right{
    flex:1;overflow-y:auto;
    background:var(--paper);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;
  }
  .bd-resume-label{
    font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:10px;
  }
  .bd-resume-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .bd-legend-chip{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;
    background:var(--paper-2);border:1px solid var(--line);color:var(--ink-soft);
  }
  .bd-chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .bd-resume-body{
    font-size:12.5px;line-height:1.75;color:var(--ink);
    white-space:pre-wrap;word-break:break-word;
  }
  .bd-resume-empty{
    font-size:13px;color:var(--ink-soft);font-style:italic;
    text-align:center;padding:48px 0;
  }

  /* ---- motion system ---- */
  @keyframes rsecIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @keyframes popIn{0%{opacity:0;transform:scale(.88) translateY(10px);}60%{transform:scale(1.02);}100%{opacity:1;transform:none;}}
  @keyframes slideUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .rsec{animation:rsecIn .38s cubic-bezier(.16,1,.3,1);}
  .rsec > *{animation:slideUp .38s cubic-bezier(.16,1,.3,1);}
  .rsec > *:nth-child(2){animation-delay:.06s;}
  .rsec > *:nth-child(3){animation-delay:.12s;}
  .rsec > *:nth-child(4){animation-delay:.18s;}
  .rsec > *:nth-child(5){animation-delay:.24s;}

  /* section text */
  .rsec-title{font-size:clamp(20px,2.6vw,26px);margin-bottom:6px;}
  .rsec-sub{font-size:14px;color:var(--ink-soft);margin-bottom:18px;line-height:1.5;}
  .rsec-note{font-size:14px;color:var(--ink-soft);margin-top:14px;}
  .rsec-center{text-align:center;padding:10px 0 4px;}

  /* ---- benchmark peer avatars on zone bar ---- */
  .res-bench-peer{
    position:absolute;top:50%;left:0;
    transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;
    transition:left 1.7s cubic-bezier(.2,.7,.2,1);
    pointer-events:none;
  }
  .res-bench-peer-label{
    position:absolute;bottom:calc(100% + 5px);
    font-size:10px;font-weight:700;color:#fff;
    background:rgba(255,255,255,.15);
    padding:2px 7px;border-radius:99px;white-space:nowrap;
  }
  .res-bench-peer-dot{
    width:30px;height:30px;border-radius:50%;
    display:grid;place-items:center;
    font-size:10px;font-weight:800;color:#fff;
    border:2.5px solid rgba(14,42,71,.6);
  }
  .res-bench-peer-a .res-bench-peer-dot{background:linear-gradient(135deg,#22C55E,#16a34a);}
  .res-bench-peer-b .res-bench-peer-dot{background:linear-gradient(135deg,#a78bfa,#7c3aed);}

  /* ---- score bubble ---- */
  .score-bubble{
    display:inline-flex;flex-direction:column;align-items:center;
    background:var(--paper);border:1.5px solid var(--line);
    border-radius:28px;padding:22px 36px 18px;
    box-shadow:0 4px 24px -8px rgba(42,125,225,.13);
    animation:popIn .55s cubic-bezier(.16,1,.3,1) both .08s;
  }
  .res-label{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;letter-spacing:.01em;}
  .res-label b{color:var(--ink);}
  .score-num-row{display:flex;align-items:baseline;gap:3px;line-height:1;}
  .res-big-score{font-family:"Fraunces",serif;font-size:72px;font-weight:700;color:var(--rise);}
  .res-big-score.res-denom{font-size:22px;color:var(--ink-soft);font-weight:500;font-family:"Hanken Grotesk",sans-serif;}
  .res-track{height:6px;background:var(--line);border-radius:99px;margin:12px auto 0;width:180px;overflow:hidden;}
  .res-fill{height:100%;width:0;border-radius:99px;transition:width 1.5s cubic-bezier(.2,.7,.2,1),background .6s ease;}
  .score-verdict{
    margin-top:10px;font-size:13px;font-weight:600;
    padding:5px 14px;border-radius:99px;
    background:rgba(42,125,225,.08);color:var(--rise);
  }

  /* ---- category bars ---- */
  .res-cats{display:flex;flex-direction:column;gap:8px;}
  .res-cat{
    background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 15px;
    animation:slideUp .36s cubic-bezier(.16,1,.3,1) both;
  }
  .res-cat:nth-child(1){animation-delay:.06s;}
  .res-cat:nth-child(2){animation-delay:.12s;}
  .res-cat:nth-child(3){animation-delay:.18s;}
  .res-cat:nth-child(4){animation-delay:.24s;}
  .res-cat:nth-child(5){animation-delay:.30s;}
  .res-cat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;}
  .res-cat-name-wrap{display:flex;flex-direction:column;gap:2px;}
  .res-cat-name{font-size:13px;font-weight:700;}
  .res-cat-def{font-family:"Fraunces",Georgia,serif;font-size:11px;font-style:italic;color:#8fa8c8;line-height:1.4;}
  .res-cat-score{font-family:"Fraunces",serif;font-size:15px;font-weight:700;flex-shrink:0;margin-top:1px;}
  .res-cat-bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;}
  .res-cat-fill{height:100%;border-radius:99px;width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1);}

  /* ---- lesson ---- */
  .res-lesson-tag{
    font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--rise);background:rgba(42,125,225,.1);border-radius:99px;
    padding:4px 12px;display:inline-block;margin-bottom:12px;
  }
  .ex{font-size:14px;color:var(--ink-soft);line-height:1.55;margin-bottom:12px;}
  .action{
    font-size:14px;font-weight:600;color:var(--ink);
    background:rgba(42,125,225,.06);border:1px solid rgba(42,125,225,.14);
    border-radius:14px;padding:11px 14px;display:flex;gap:8px;align-items:flex-start;
  }
  .action::before{content:"→";color:var(--rise);flex-shrink:0;font-weight:700;}

  /* ---- gap: TL;DR + expand ---- */
  .gap-cat-chip{
    display:inline-flex;align-items:center;gap:6px;align-self:center;
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--rise);background:rgba(42,125,225,.08);
    padding:5px 12px;border-radius:99px;margin-bottom:12px;
  }
  .gap-takeaway{
    font-family:"Fraunces",Georgia,serif;font-weight:700;
    font-size:clamp(18px,2.3vw,23px);line-height:1.25;color:var(--ink);
    text-align:center;margin-bottom:16px;
  }
  .gap-why{margin-top:14px;border-top:1px solid var(--line);}
  .gap-why summary{
    list-style:none;cursor:pointer;user-select:none;
    display:flex;align-items:center;gap:7px;
    font-size:13px;font-weight:600;color:var(--ink-soft);
    padding:12px 2px 0;transition:color .15s;
  }
  .gap-why summary::-webkit-details-marker{display:none;}
  .gap-why summary:hover{color:var(--ink);}
  .gap-why summary .chev{
    width:14px;height:14px;flex-shrink:0;color:var(--rise);
    transition:transform .2s ease;
  }
  .gap-why[open] summary .chev{transform:rotate(90deg);}
  .gap-why-body{
    font-size:14px;color:var(--ink-soft);line-height:1.55;
    padding:10px 2px 4px;animation:slideUp .3s cubic-bezier(.16,1,.3,1);
  }
  .gap-why-body .gap-ex{
    display:block;margin-top:8px;padding:10px 12px;
    background:var(--paper);border:1px solid var(--line);border-radius:12px;
    color:var(--ink);font-size:13px;
  }

  /* ---- resource bubbles ---- */
  .res-resblock{margin-top:18px;}
  .rsec-reslabel{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;}
  .res-resources{display:flex;flex-direction:column;gap:7px;}
  .res-resource{
    background:var(--paper-2);border:1px solid var(--line);border-radius:16px;
    padding:10px 14px;display:flex;flex-direction:column;gap:4px;
    animation:popIn .35s cubic-bezier(.16,1,.3,1) both;
  }
  .res-resource:nth-child(1){animation-delay:.05s;}
  .res-resource:nth-child(2){animation-delay:.12s;}
  .res-resource:nth-child(3){animation-delay:.19s;}
  .res-resource:nth-child(4){animation-delay:.26s;}
  .res-resource-link{
    font-size:13px;font-weight:700;color:var(--rise);
    display:inline-flex;align-items:center;gap:4px;
    text-decoration:none;
  }
  .res-resource-link:hover{text-decoration:underline;}
  .res-resource-link::after{content:"↗";font-size:11px;opacity:.7;}
  .res-resource-why{font-size:12px;color:var(--ink-soft);line-height:1.45;}
  .res-resource.res-loading{color:var(--ink-soft);border-style:dashed;animation:none;}
  .res-resource.res-loading::before{content:"";}

  /* benchmark (dark) */
  .res-bench{background:var(--ink);border-radius:18px;padding:26px 24px;color:#fff;}
  .res-bench-loading{font-size:14px;color:#9fb0c9;text-align:center;padding:8px 0;}
  .res-bench-content{display:none;}
  .res-bench-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9fb0c9;margin-bottom:8px;}
  .res-bench-big{font-family:"Fraunces",serif;font-size:28px;font-weight:700;line-height:1;margin-bottom:14px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
  .res-bench-big #benchPct{font-size:64px;font-weight:700;color:var(--highlight);line-height:1;}
  .res-bench-big span:last-child{font-size:16px;color:#9fb0c9;font-family:"Hanken Grotesk",sans-serif;font-weight:500;}
  /* zone bar */
  .res-bench-zone-wrap{margin-bottom:16px;}
  .res-bench-zone-bar{
    position:relative;height:14px;border-radius:99px;
    background:linear-gradient(90deg,#E5484D 0%,#E5484D 44%,#F5A524 46%,#F5A524 68%,#22C55E 70%,#22C55E 100%);
    margin-bottom:30px;
  }
  .res-bench-marker{
    position:absolute;top:50%;left:0;
    transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;
    transition:left 1.5s cubic-bezier(.2,.7,.2,1);
  }
  .res-bench-marker-dot{
    width:22px;height:22px;border-radius:50%;
    background:#fff;border:3px solid #fff;
    box-shadow:0 0 0 4px rgba(255,255,255,.22);
    transition:background 1s ease,border-color 1s ease;
  }
  .res-bench-marker-you{
    position:absolute;top:26px;
    font-size:11px;font-weight:700;color:#fff;
    background:rgba(255,255,255,.15);
    padding:2px 8px;border-radius:99px;white-space:nowrap;
  }
  .res-bench-zone-labels{
    display:flex;justify-content:space-between;
    font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  }
  .res-bench-zone-labels span:nth-child(1){color:#E5484D;}
  .res-bench-zone-labels span:nth-child(2){color:#F5A524;}
  .res-bench-zone-labels span:nth-child(3){color:#22C55E;}
  .res-bench-verdict{
    display:inline-block;font-size:13px;font-weight:700;
    padding:5px 14px;border-radius:99px;margin-bottom:10px;
  }
  .res-bench-sub{font-size:13px;color:#9fb0c9;margin-bottom:16px;}

  /* ---- roadmap ---- */
  .rm-progress-bar{height:3px;background:var(--line);border-radius:99px;margin-bottom:22px;overflow:hidden;}
  .rm-progress-fill{height:100%;border-radius:99px;background:var(--rise);transition:width .6s cubic-bezier(.16,1,.3,1);}
  .rm-steps{position:relative;display:flex;flex-direction:column;}
  .rm-connector{position:absolute;left:21px;top:44px;bottom:44px;width:2px;background:var(--line);z-index:0;}
  .rm-step{display:flex;align-items:flex-start;gap:14px;position:relative;z-index:1;padding-bottom:16px;opacity:0;transform:translateY(18px);transition:opacity .45s cubic-bezier(.16,1,.3,1),transform .45s cubic-bezier(.16,1,.3,1);}
  .rm-step.rm-visible{opacity:1;transform:translateY(0);}
  .rm-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;position:relative;z-index:2;cursor:pointer;background:var(--paper);border:2px solid var(--rise);color:var(--rise);transition:transform .18s cubic-bezier(.16,1,.3,1),background .2s,border-color .2s;}
  .rm-icon:hover{transform:scale(1.08);}
  .rm-icon:active{transform:scale(.95);}
  .rm-icon.rm-done{background:#dcfce7;border-color:#22c55e;color:#16a34a;animation:rmPop .3s cubic-bezier(.34,1.56,.64,1);}
  @keyframes rmPop{0%{transform:scale(.7);}60%{transform:scale(1.15);}100%{transform:scale(1);}}
  .rm-card{flex:1;border-radius:12px;padding:13px 16px;border:1px solid var(--line);background:var(--paper-2);position:relative;overflow:hidden;cursor:pointer;transition:border-color .2s;}
  .rm-card:hover{border-color:rgba(42,125,225,.3);}
  .rm-card.rm-card-done{border-color:rgba(34,197,94,.3);}
  .rm-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 0% 50%,rgba(42,125,225,.07) 0%,transparent 70%);transition:opacity .3s;}
  .rm-glow-done{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 0% 50%,rgba(34,197,94,.07) 0%,transparent 70%);opacity:0;transition:opacity .3s;}
  .rm-card-done .rm-glow{opacity:0;}
  .rm-card-done .rm-glow-done{opacity:1;}
  .rm-tag{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--rise);display:flex;align-items:center;gap:5px;margin-bottom:4px;}
  .rm-dot{width:5px;height:5px;border-radius:50%;background:var(--rise);display:inline-block;}
  .rm-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:3px;transition:color .2s;}
  .rm-card-done .rm-title{text-decoration:line-through;color:var(--ink-soft);}
  .rm-desc{font-size:12px;color:var(--ink-soft);line-height:1.5;}
  .rm-hint{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:6px;opacity:.6;}

  /* ---- bottom nav ---- */
  .rnav{display:flex;align-items:center;justify-content:space-between;gap:14px;
    margin-top:28px;padding-top:20px;border-top:1px solid var(--line);}
  .rnav-btn{
    display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-weight:600;font-size:15px;
    padding:11px 20px;border-radius:12px;cursor:pointer;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);
    transition:transform .14s,box-shadow .18s,background .18s,border-color .18s,opacity .18s;
  }
  .rnav-btn:hover{border-color:var(--ink);}
  .rnav-btn:disabled{opacity:.4;cursor:not-allowed;}
  .rnav-next{background:var(--rise);color:#fff;border-color:transparent;}
  .rnav-next:hover{transform:translateY(-1px);background:var(--rise-bright);box-shadow:0 8px 18px -8px rgba(42,125,225,.55);border-color:transparent;}
  .rdots{display:flex;gap:7px;}
  .rdot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s;}
  .rdot.active{background:var(--rise);transform:scale(1.25);}
  .rdot.visited{background:var(--rise-bright);}

  /* empty state */
  .empty{max-width:520px;margin:80px auto;text-align:center;padding:0 24px;}
  .empty h1{font-size:30px;margin-bottom:14px;}
  .empty p{color:var(--ink-soft);margin-bottom:24px;}

  /* ---- breakdown two-panel layout ---- */
  /* shift layout right to clear the fixed sidebar (220px) with 24px gap */
  .results-layout--bd{
    justify-content:flex-start;
    padding-left:252px;
    padding-right:20px;
  }
  /* expand panel to fill remaining viewport width */
  .rpanel--bd{
    max-width:none;
    width:100%;
    height:calc(100vh - 62px - 44px);
    min-height:0;
  }
  .rpanel--bd .rpanel-inner{
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .rpanel--bd .rpanel-inner > .rsec{
    flex:1;min-height:0;display:flex;flex-direction:column;
  }
  /* two columns inside rpanel-inner */
  .bd-split{
    flex:1;min-height:0;
    display:flex;gap:16px;
    overflow:hidden;
  }
  .bd-left{
    width:45%;flex-shrink:0;
    overflow-y:auto;
    padding-right:4px;
  }
  .bd-right{
    flex:1;
    overflow-y:auto;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
  }
  .bd-resume-label{
    font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:10px;
  }
  .bd-resume-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .bd-legend-chip{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;
    background:var(--paper-2);border:1px solid var(--line);color:var(--ink-soft);
  }
  .bd-chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .bd-resume-body{
    font-size:12.5px;line-height:1.75;color:var(--ink);
    white-space:pre-wrap;word-break:break-word;
  }
  .bd-resume-empty{
    font-size:13px;color:var(--ink-soft);font-style:italic;
    text-align:center;padding:48px 0;
  }

  /* ---- responsive ---- */
  @media(max-width:820px){
    .results-layout{flex-direction:column;align-items:stretch;}
    .rtabs{
      width:100%;position:static;flex-direction:row;overflow-x:auto;gap:8px;
      padding-bottom:4px;-webkit-overflow-scrolling:touch;top:auto;left:auto;
    }
    .rtabs-head{display:none;}
    .rtab{width:auto;flex-shrink:0;white-space:nowrap;}
    .rt-label{max-width:140px;}
    .rpanel{min-height:auto;max-width:100%;}
    .rpanel--wide{max-width:100%;height:auto;}
    .rpanel--wide .rpanel-inner{overflow:visible;}
    .rpanel--wide .rpanel-inner > .rsec{flex:none;}
    .results-layout--bd{padding-left:0;padding-right:0;}
    .rpanel--bd{height:auto;max-width:100%;}
    .rpanel--bd .rpanel-inner{overflow:visible;}
    .rpanel--bd .rpanel-inner > .rsec{flex:none;}
    .bd-split{flex-direction:column;overflow:visible;height:auto;}
    .bd-left{width:100%;overflow-y:visible;}
    .bd-right{min-height:200px;}
  }
  @media(prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;}
  }
</style>
</head>
<body>

<header>
  <div class="nav-in">
    <a class="brand" href="index.html">Hir<span class="ed">ED</span></a>
    <a href="index.html#start" class="btn btn-ghost">↩ Start over</a>
  </div>
</header>

<div id="root"></div>

<script>
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- pull the data handed over by the landing page ----
  const API_BASE = sessionStorage.getItem('hired_api') || 'https://optimum-write-entertainment-agenda.trycloudflare.com';
  let data, target, targetObj;
  try { data = JSON.parse(sessionStorage.getItem('hired_result') || 'null'); } catch { data = null; }
  try {
    targetObj = JSON.parse(sessionStorage.getItem('hired_target') || 'null') || {};
    target = targetObj.value || 'your target';
  } catch { targetObj = {}; target = 'your target'; }

  const USER_ID = sessionStorage.getItem('hired_uid') || (() => {
    const id = Math.random().toString(36).slice(2,10);
    sessionStorage.setItem('hired_uid', id);
    return id;
  })();

  const resumeText = (data && data.resume_text) || sessionStorage.getItem('hired_resume') || localStorage.getItem('hired_resume') || '';

  function buildAnnotatedResume(text){
    if(!text) return `<span>${esc(text)}</span>`;

    const raw = Array.isArray(data.annotations) ? data.annotations : [];
    const valid = raw
      .map(a => ({...a, start: Number(a.start), end: Number(a.end)}))
      .filter(a => !isNaN(a.start) && a.start >= 0 && !isNaN(a.end) && a.end > a.start)
      .sort((a, b) => a.start - b.start);

    if(!valid.length) return `<span>${esc(text)}</span>`;

    const parts = [];
    let cursor = 0;
    for(const ann of valid){
      if(ann.start < cursor) continue;
      if(ann.start > cursor) parts.push(esc(text.slice(cursor, ann.start)));
      const snippet = text.slice(ann.start, ann.end);
      const s = (ann.sentiment || 'neutral').toLowerCase();
      const bg  = s === 'positive' ? 'rgba(34,197,94,.32)'  : s === 'negative' ? 'rgba(229,72,77,.32)'  : 'rgba(245,158,11,.32)';
      const col = s === 'positive' ? '#14532d'               : s === 'negative' ? '#991b1b'               : '#92400e';
      const tip = ann.reason ? ` title="${ann.reason.replace(/"/g,'&quot;')}"` : '';
      parts.push(`<mark style="background:${bg};color:${col};border-radius:4px;padding:1px 4px;font-weight:700;font-style:normal;cursor:help;box-shadow:0 0 0 1.5px ${bg};"${tip}>${esc(snippet)}</mark>`);
      cursor = ann.end;
    }
    if(cursor < text.length) parts.push(esc(text.slice(cursor)));
    return parts.join('');
  }

  const root = document.getElementById('root');

  // ---- empty state if opened directly ----
  if(!data || typeof data.score !== 'number'){
    root.innerHTML = `
      <div class="empty">
        <h1>No results yet</h1>
        <p>Run a resume through HirED first, and your readiness breakdown will show up here.</p>
        <a href="index.html#start" class="btn rnav-next">Check your readiness</a>
      </div>`;
    throw new Error('no-data');
  }

  // ---- helpers ----
  const CAT_LABELS = {
    skills_match:'Skills Match', quantified_achievements:'Quantified Impact',
    experience:'Experience', education:'Education', clarity:'Clarity'
  };
  const scoreColor = v => v<40 ? '#E5484D' : v<70 ? '#F5A524' : '#22C55E';
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function countUp(el, from, to, ms, onTick){
    const apply = v => { el.textContent = v; if(onTick) onTick(v); };
    if(reduce){ apply(to); return; }
    const start = performance.now();
    (function tick(now){
      const t = Math.min(1,(now-start)/ms);
      const e = 1-Math.pow(1-t,3);
      apply(Math.round(from+(to-from)*e));
      if(t<1) requestAnimationFrame(tick);
    })(performance.now());
  }

  // caches for lazy secondary calls
  const resCache = {};
  let benchState = null; // null | 'loading' | {percentile}

  // ---- build sections from the data ----
  const cats = data.categories || {};
  const allLessons = Array.isArray(data.lessons) ? data.lessons : [];
  const GAP_ORDER = ['education','skills_match','clarity'];
  const lessons = GAP_ORDER.map(cat => allLessons.find(l => l.category === cat)).filter(Boolean);
  const sections = [];

  sections.push({
    label: 'Readiness',
    render(){
      const verdict = data.score < 40 ? "Every gap here is fixable — we'll show you how."
        : data.score < 70 ? "Solid base. A few targeted fixes move this fast."
        : "You're in range. Tighten the gaps and you're there.";
      return `<div class="rsec rsec-center">
        <h2 class="rsec-title" style="font-weight:800;margin-bottom:16px;">Scoring</h2>
        <div class="score-bubble">
          <div class="res-label">Readiness for <b>${esc(target)}</b></div>
          <div class="score-num-row">
            <span class="res-big-score" id="bigScore">0</span>
            <span class="res-big-score res-denom">/100</span>
          </div>
          <div class="res-track"><div class="res-fill" id="bigFill"></div></div>
          <div class="score-verdict" id="scoreVerdict">${verdict}</div>
        </div>
      </div>`;
    },
    onShow(){
      const el = document.getElementById('bigScore'), fill = document.getElementById('bigFill');
      fill.style.background = scoreColor(data.score);
      countUp(el, 0, data.score, 1400, v => { fill.style.width = v+'%'; el.style.color = scoreColor(v); });
    }
  });

  const CAT_DEFS = {
    skills_match: 'How closely your skills match the job requirements.',
    quantified_achievements: 'How well you use numbers to show your achievements and results.',
    experience: 'How relevant your work, projects, or internships are to the role.',
    education: 'How well your education, certifications, and coursework align with the position.',
    clarity: 'How easy your resume is to read, understand, and scan quickly.'
  };

  if(Object.keys(cats).length){
    sections.push({
      label: 'Breakdown',
      _isBreakdown: true,
      render(){
        const rows = Object.entries(cats).map(([k,cat]) => {
          const label = CAT_LABELS[k]||k, color = scoreColor(cat.score);
          const def = CAT_DEFS[k] || '';
          return `<div class="res-cat">
            <div class="res-cat-top">
              <div class="res-cat-name-wrap">
                <span class="res-cat-name">${esc(label)}</span>
                ${def ? `<span class="res-cat-def">${esc(def)}</span>` : ''}
              </div>
              <span class="res-cat-score" style="color:${color}">${cat.score}</span>
            </div>
            <div class="res-cat-bar"><div class="res-cat-fill" data-w="${cat.score}" style="background:${color}"></div></div>
          </div>`;
        }).join('');

        const resumeBody = resumeText
          ? `<div class="bd-resume-label">Your resume</div>
             <div class="bd-resume-legend">
               <span class="bd-legend-chip"><span class="bd-chip-dot" style="background:#16a34a"></span>Strength</span>
               <span class="bd-legend-chip"><span class="bd-chip-dot" style="background:#d97706"></span>Could be stronger</span>
               <span class="bd-legend-chip"><span class="bd-chip-dot" style="background:#dc2626"></span>Gap</span>
             </div>
             <p style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">Hover a highlight to see why</p>
             <div class="bd-resume-body">${buildAnnotatedResume(resumeText)}</div>`
          : `<div class="bd-resume-empty">Resume preview not available.<br>Paste your resume on the upload screen to see it here.</div>`;

        return `<div class="rsec">
          <h2 class="rsec-title" style="font-weight:800;margin-bottom:6px;">Skill Breakdown</h2>
          <p class="rsec-sub">Five areas scored — see how each maps to your resume on the right.</p>
          <div class="bd-split">
            <div class="bd-left">
              <div class="res-cats">${rows}</div>
            </div>
            <div class="bd-right">${resumeBody}</div>
          </div>
        </div>`;
      },
      onShow(){
        requestAnimationFrame(()=>document.querySelectorAll('.res-cat-fill').forEach(f=>f.style.width = f.dataset.w+'%'));
      }
    });
  }

  // Punchy one-line takeaway per category — the scannable headline for each gap.
  const GAP_TAKEAWAY = {
    skills_match: 'Match more of the job’s must-have skills.',
    quantified_achievements: 'Put real numbers on your wins.',
    experience: 'Make your experience clearly relevant.',
    education: 'Line your education up with the role.',
    clarity: 'Make your resume easy to skim.'
  };

  // Build up to 3 gaps. Start with the AI lessons, then top up from the
  // lowest-scoring categories not already covered, so a third gap always
  // shows even when the backend returns fewer than 3 lessons.
  const coveredCats = new Set(lessons.map(l => l && l.category).filter(Boolean));
  const fillerCats = Object.entries(cats)
    .sort((a, b) => (a[1].score ?? 100) - (b[1].score ?? 100))
    .map(([k]) => k)
    .filter(k => !coveredCats.has(k));

  const gapList = lessons.slice(0, 3).map(l => ({
    category: l.category,
    principle: l.principle || CAT_DEFS[l.category] || '',
    example: l.example || '',
    action: l.action || ''
  }));
  for(let fi = 0; gapList.length < 3 && fi < fillerCats.length; fi++){
    const cat = fillerCats[fi];
    gapList.push({
      category: cat,
      principle: CAT_DEFS[cat] || '',
      example: '',
      action: `Strengthen your ${(CAT_LABELS[cat]||cat).toLowerCase()} — it's one of your lower-scoring areas, so improving it will lift your readiness the most.`
    });
  }

  gapList.forEach((l, i) => {
    sections.push({
      label: `Gap ${i+1} · ${CAT_LABELS[l.category]||l.category}`,
      render(){
        const catLabel = CAT_LABELS[l.category] || l.category || 'Gap';
        const takeaway = GAP_TAKEAWAY[l.category] || l.principle || catLabel;
        const hasDetail = !!(l.principle || l.example);
        const chev = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;
        return `<div class="rsec">
          <div style="display:flex;flex-direction:column;align-items:center;">
            <span class="gap-cat-chip">Gap ${i+1} · ${esc(catLabel)}</span>
          </div>
          <div class="gap-takeaway">${esc(takeaway)}</div>
          ${l.action ? `<div class="action">${esc(l.action)}</div>` : ''}
          ${hasDetail ? `<details class="gap-why">
            <summary>${chev}Why this matters</summary>
            <div class="gap-why-body">
              ${l.principle ? esc(l.principle) : ''}
              ${l.example ? `<span class="gap-ex">${esc(l.example)}</span>` : ''}
            </div>
          </details>` : ''}
          <div class="res-resblock">
            <div class="rsec-reslabel">Top resources for this gap</div>
            <div class="res-resources" id="resbox-${i}">
              <div class="res-resource res-loading"><span style="color:var(--ink-soft);font-size:13px;">Finding resources…</span></div>
            </div>
          </div>
        </div>`;
      },
      onShow(){ loadResources(l.category, 'resbox-'+i, target); }
    });
  });

  if(data.score && target){
    sections.push({
      label: 'How you compare',
      render(){
        return `<div class="rsec">
          <h2 class="rsec-title" style="font-weight:800;text-align:center;">How prepared are you, really?</h2>
          <p class="rsec-sub" style="text-align:center;">Benchmarked against real candidates targeting this role.</p>
          <div class="res-bench">
            <div class="res-bench-loading" id="benchLoading">Benchmarking against real candidates…</div>
            <div class="res-bench-content" id="benchContent">
              <div class="res-bench-label">Your standing</div>
              <div class="res-bench-big">Ahead of <span id="benchPct">—</span>% <span>of candidates</span></div>
              <div class="res-bench-sub" id="benchSub"></div>
              <div class="res-bench-zone-wrap">
                <div class="res-bench-zone-bar">
                  <div class="res-bench-peer res-bench-peer-a" id="benchPeerA">
                    <div class="res-bench-peer-label" id="benchPeerALabel"></div>
                    <div class="res-bench-peer-dot">ML</div>
                  </div>
                  <div class="res-bench-peer res-bench-peer-b" id="benchPeerB">
                    <div class="res-bench-peer-label" id="benchPeerBLabel"></div>
                    <div class="res-bench-peer-dot">JR</div>
                  </div>
                  <div class="res-bench-marker" id="benchMarker">
                    <div class="res-bench-marker-dot" id="benchDot"></div>
                    <div class="res-bench-marker-you">You</div>
                  </div>
                </div>
                <div class="res-bench-zone-labels">
                  <span>Needs Work</span>
                  <span>Improving</span>
                  <span>Green Zone</span>
                </div>
              </div>
              <div class="res-bench-verdict" id="benchVerdict"></div>
            </div>
          </div>
        </div>`;
      },
      onShow(){ loadBenchmark(); }
    });
  }

  // ---- roadmap section ----
  sections.push({
    label: 'Your roadmap',
    render(){
      const steps = data.gaps && data.gaps.length ? data.gaps.map((g, i) => {
        const icons = ['ti-pencil','ti-message','ti-send','ti-link','ti-calendar'];
        const icon = icons[i] || 'ti-arrow-right';
        return `
          <div class="rm-step" id="rms${i}" style="transition-delay:${i*110}ms">
            <div class="rm-icon" onclick="rmToggle(${i})" title="Mark complete">
              <i class="ti ${icon}" aria-hidden="true"></i>
            </div>
            <div class="rm-card" onclick="rmToggle(${i})">
              <div class="rm-glow"></div>
              <div class="rm-glow-done"></div>
              <div class="rm-tag"><span class="rm-dot"></span><span>${g.category || 'Gap'}</span></div>
              <div class="rm-title">${g.action || g.title || 'Next step'}</div>
              <div class="rm-desc">${g.micro_step || g.description || ''}</div>
            </div>
          </div>`;
      }) : [
        `<div class="rm-step" id="rms0" style="transition-delay:0ms">
          <div class="rm-icon" onclick="rmToggle(0)"><i class="ti ti-pencil" aria-hidden="true"></i></div>
          <div class="rm-card" onclick="rmToggle(0)">
            <div class="rm-glow"></div><div class="rm-glow-done"></div>
            <div class="rm-tag"><span class="rm-dot"></span><span>Resume</span></div>
            <div class="rm-title">Rewrite 1 bullet point</div>
            <div class="rm-desc">Change "responsible for X" to "delivered X by doing Y."</div>
          </div>
        </div>`,
        `<div class="rm-step" id="rms1" style="transition-delay:110ms">
          <div class="rm-icon" onclick="rmToggle(1)"><i class="ti ti-message" aria-hidden="true"></i></div>
          <div class="rm-card" onclick="rmToggle(1)">
            <div class="rm-glow"></div><div class="rm-glow-done"></div>
            <div class="rm-tag"><span class="rm-dot"></span><span>Interview</span></div>
            <div class="rm-title">Answer 1 behavioral question</div>
            <div class="rm-desc">Use STAR format on a question common for your role.</div>
          </div>
        </div>`,
        `<div class="rm-step" id="rms2" style="transition-delay:220ms">
          <div class="rm-icon" onclick="rmToggle(2)"><i class="ti ti-send" aria-hidden="true"></i></div>
          <div class="rm-card" onclick="rmToggle(2)">
            <div class="rm-glow"></div><div class="rm-glow-done"></div>
            <div class="rm-tag"><span class="rm-dot"></span><span>Network</span></div>
            <div class="rm-title">Send 1 cold message</div>
            <div class="rm-desc">Find one alum or recruiter. Use a short template and send it.</div>
          </div>
        </div>`
      ];
      const total = steps.length;
      return `<div class="rsec">
        <h2 class="rsec-title" style="font-weight:800;text-align:center;">Your roadmap</h2>
        <p class="rsec-sub" style="text-align:center;">Small steps — personalized to your gaps. Click each one when done.</p>
        <div class="rm-progress-bar"><div class="rm-progress-fill" id="rmPbar" style="width:0%"></div></div>
        <div class="rm-steps" id="rmSteps" data-total="${total}">
          <div class="rm-connector"></div>
          ${steps.join('')}
        </div>
        <p class="rm-hint">Click any step to mark it complete</p>
      </div>`;
    },
    onShow(){
      requestAnimationFrame(()=>{
        document.querySelectorAll('.rm-step').forEach(el => el.classList.add('rm-visible'));
      });
      window._rmDone = window._rmDone || new Set();
    }
  });

  window.rmToggle = function(i){
    const step = document.getElementById('rms'+i);
    if(!step) return;
    const icon = step.querySelector('.rm-icon');
    const card = step.querySelector('.rm-card');
    const done = window._rmDone || (window._rmDone = new Set());
    const iconNames = ['ti-pencil','ti-message','ti-send','ti-link','ti-calendar'];
    if(done.has(i)){
      done.delete(i);
      icon.innerHTML = `<i class="ti ${iconNames[i]||'ti-arrow-right'}" aria-hidden="true"></i>`;
      icon.classList.remove('rm-done');
      card.classList.remove('rm-card-done');
    } else {
      done.add(i);
      icon.innerHTML = `<i class="ti ti-check" aria-hidden="true"></i>`;
      icon.classList.add('rm-done');
      card.classList.add('rm-card-done');
    }
    const total = parseInt(document.getElementById('rmSteps')?.dataset.total || 3);
    const pct = Math.round((done.size / total) * 100);
    const bar = document.getElementById('rmPbar');
    if(bar) bar.style.width = pct + '%';
  };

  // ---- lazy secondary fetches ----
  async function loadResources(category, boxId, role){
    const box = document.getElementById(boxId);
    const cacheKey = `${category}::${role||target}`;
    if(resCache[cacheKey]){ paintResources(box, resCache[cacheKey], role||target); return; }
    try{
      const r = await fetch(`${API_BASE}/resources`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ gap_category: category, user_id: USER_ID, context: { target_type: role||target } })
      });
      if(!r.ok) throw 0;
      const d = await r.json();
      resCache[cacheKey] = (d.resources || []).slice(0, 3);
      const live = document.getElementById(boxId);
      if(live) paintResources(live, resCache[cacheKey], role||target);
    }catch{
      const live = document.getElementById(boxId);
      if(live) live.innerHTML = '<div class="res-resource res-loading">Resources unavailable right now.</div>';
    }
  }
  function paintResources(box, list, role){
    if(!list.length){ box.innerHTML = '<div class="res-resource res-loading"><span style="color:var(--ink-soft);font-size:13px;">No resources found.</span></div>'; return; }
    box.innerHTML = '';
    list.slice(0,3).forEach(res => {
      const el = document.createElement('div');
      el.className = 'res-resource';
      if(res && typeof res === 'object'){
        const url  = res.url  || '';
        // Shorten name to first 3 words max
        const fullName = res.name || url;
        const shortName = esc(fullName.split(' ').slice(0,3).join(' '));
        const why  = esc(res.description || '');
        el.innerHTML = url
          ? `<a class="res-resource-link" href="${esc(url)}" target="_blank" rel="noopener">${shortName}</a>
             <span class="res-resource-why">${why}</span>`
          : `<span class="res-resource-link" style="cursor:default">${shortName}</span>
             <span class="res-resource-why">${why}</span>`;
      } else {
        el.innerHTML = `<span class="res-resource-link" style="cursor:default">${esc(String(res).split(' ').slice(0,3).join(' '))}</span>`;
      }
      box.appendChild(el);
    });
  }

  async function loadBenchmark(){
    if(benchState && benchState !== 'loading'){ paintBenchmark(benchState); return; }
    if(benchState === 'loading') return;
    benchState = 'loading';
    try{
      const r = await fetch(`${API_BASE}/benchmark`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ score: data.score, user_id: USER_ID, target: { value: target, type: targetObj.type || 'role' } })
      });
      if(!r.ok) throw 0;
      const d = await r.json();
      benchState = { percentile: d.percentile, sample_size: d.sample_size, message: d.message };
      paintBenchmark(benchState);
    }catch{
      benchState = null;
      const l = document.getElementById('benchLoading');
      if(l) l.textContent = 'Benchmark unavailable right now.';
    }
  }
  function paintBenchmark(b){
    const loading = document.getElementById('benchLoading');
    const content = document.getElementById('benchContent');
    if(!loading || !content) return;
    loading.style.display = 'none';
    content.style.display = 'block';

    const pct = b.percentile;
    const markerPos = Math.max(3, Math.min(97, pct));

    const isRed    = pct < 45;
    const isYellow = pct >= 45 && pct < 70;
    const zoneColor  = isRed ? '#E5484D' : isYellow ? '#F5A524' : '#22C55E';
    const zoneLabel  = isRed ? 'Needs Work' : isYellow ? 'Slight Improvement' : 'Green Zone';

    document.getElementById('benchPct').textContent = pct;
    document.getElementById('benchPct').style.color = zoneColor;

    const dot = document.getElementById('benchDot');
    if(dot){ dot.style.background = zoneColor; dot.style.borderColor = zoneColor; }

    const marker = document.getElementById('benchMarker');
    if(marker) setTimeout(() => { marker.style.left = markerPos + '%'; }, 60);

    const seed = pct * 7 % 10;
    const aheadPct = Math.min(96, pct + 10 + seed);
    const behindPct = Math.max(4, pct - 9 - (seed % 6));
    const peerA = document.getElementById('benchPeerA');
    const peerB = document.getElementById('benchPeerB');
    if(peerA) setTimeout(() => { peerA.style.left = Math.max(3,Math.min(97,aheadPct)) + '%'; }, 80);
    if(peerB) setTimeout(() => { peerB.style.left = Math.max(3,Math.min(97,behindPct)) + '%'; }, 80);
    const peerALabel = document.getElementById('benchPeerALabel');
    const peerBLabel = document.getElementById('benchPeerBLabel');
    if(peerALabel) peerALabel.textContent = aheadPct + '%';
    if(peerBLabel) peerBLabel.textContent = behindPct + '%';

    const verdict = document.getElementById('benchVerdict');
    if(verdict){
      verdict.textContent = zoneLabel;
      verdict.style.color = zoneColor;
      verdict.style.background = zoneColor + '22';
    }

    document.getElementById('benchSub').textContent = `You are ahead of ${pct}% of candidates targeting this role.`;
  }

  // ---- render shell ----
  root.innerHTML = `
    <div class="results-layout">
      <aside class="rtabs" id="rtabs">
        <div class="rtabs-head">Career Prep Plan</div>
      </aside>
      <section class="rpanel">
        <div class="rstep-count" id="stepCount"></div>
        <div class="rpanel-inner" id="panelInner"></div>
        <div class="rnav">
          <button class="rnav-btn" id="prevBtn">← Back</button>
          <div class="rdots" id="dots"></div>
          <button class="rnav-btn rnav-next" id="nextBtn">Next →</button>
        </div>
      </section>
    </div>`;

  const tabsEl  = document.getElementById('rtabs');
  const dotsEl  = document.getElementById('dots');
  const inner   = document.getElementById('panelInner');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const stepCount = document.getElementById('stepCount');

  // build tabs + dots
  sections.forEach((s, i) => {
    const tab = document.createElement('button');
    tab.className = 'rtab';
    tab.innerHTML = `<span class="rt-num">${i+1}</span><span class="rt-label">${esc(s.label)}</span>`;
    tab.addEventListener('click', () => go(i));
    tabsEl.appendChild(tab);

    const dot = document.createElement('span');
    dot.className = 'rdot';
    dotsEl.appendChild(dot);
  });
  const tabBtns = [...tabsEl.querySelectorAll('.rtab')];
  const dotEls  = [...dotsEl.querySelectorAll('.rdot')];

  let current = -1;
  const visited = new Set();

  function go(i){
    if(i < 0 || i >= sections.length || i === current) return;
    current = i;
    visited.add(i);

    inner.innerHTML = sections[i].render();
    if(sections[i].onShow) sections[i].onShow();

    // widen the panel + shift the layout right to clear the fixed sidebar
    const isBd = !!sections[i]._isBreakdown;
    document.querySelector('.results-layout').classList.toggle('results-layout--bd', isBd);
    document.querySelector('.rpanel').classList.toggle('rpanel--bd', isBd);

    // tab states
    tabBtns.forEach((t, idx) => {
      t.classList.toggle('active', idx === i);
      t.classList.toggle('visited', visited.has(idx));
    });
    dotEls.forEach((d, idx) => {
      d.classList.toggle('active', idx === i);
      d.classList.toggle('visited', idx < i || visited.has(idx));
    });

    // step counter + nav buttons
    stepCount.textContent = `Step ${i+1} of ${sections.length}`;
    prevBtn.disabled = i === 0;
    if(i === sections.length - 1){
      nextBtn.textContent = '↩ Start over';
      nextBtn.onclick = () => { window.location.href = 'index.html#start'; };
    } else {
      nextBtn.textContent = 'Next →';
      nextBtn.onclick = () => go(current + 1);
    }
    // keep the active tab in view on mobile
    if(tabBtns[i]) tabBtns[i].scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
  }

  prevBtn.addEventListener('click', () => go(current - 1));
  document.addEventListener('keydown', e => {
    if(e.key === 'ArrowRight' && current < sections.length - 1) go(current + 1);
    if(e.key === 'ArrowLeft'  && current > 0) go(current - 1);
  });

  go(0);
</script>
</body>
</html>
