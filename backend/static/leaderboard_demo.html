<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HirED — Leaderboard (Page 6 test)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ===== copied verbatim from landing/results.html so this matches Page 6 exactly ===== */
  :root{
    --ink:#0E2A47; --ink-soft:#48607f; --paper:#EEF4FC; --paper-2:#FFFFFF;
    --highlight:#FFC44D; --rise:#2A7DE1; --line:#D3E2F4;
    --bad:#E5484D; --warn:#F5A524; --good:#22C55E;
    --shadow:0 2px 4px rgba(22,37,61,.05), 0 20px 48px -20px rgba(22,37,61,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ background:var(--paper);color:var(--ink); font-family:"Hanken Grotesk",system-ui,sans-serif;
    font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh; }
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;line-height:1.05;letter-spacing:-.018em;}
  .brand{font-family:"Fraunces",serif;font-weight:600;font-size:23px;letter-spacing:-.02em;padding:18px clamp(16px,4vw,40px);}
  .brand .ed{background:linear-gradient(transparent 62%,var(--highlight) 62%);}

  .wrap{max-width:560px;margin:0 auto;padding:14px 20px 60px;}
  .rsec-title{font-size:clamp(20px,2.6vw,26px);margin-bottom:6px;font-weight:800;text-align:center;}
  .rsec-sub{font-size:14px;color:var(--ink-soft);margin-bottom:18px;line-height:1.5;text-align:center;}

  /* benchmark (dark) — verbatim */
  .res-bench{background:var(--ink);border-radius:18px;padding:26px 24px;color:#fff;}
  .res-bench-loading{font-size:14px;color:#9fb0c9;text-align:center;padding:8px 0;}
  .res-bench-content{display:none;}
  .res-bench-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9fb0c9;margin-bottom:8px;}
  .res-bench-big{font-family:"Fraunces",serif;font-size:28px;font-weight:700;line-height:1;margin-bottom:14px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
  .res-bench-big #benchPct{font-size:64px;font-weight:700;color:var(--highlight);line-height:1;}
  .res-bench-big span:last-child{font-size:16px;color:#9fb0c9;font-family:"Hanken Grotesk",sans-serif;font-weight:500;}
  .res-bench-zone-wrap{margin-bottom:16px;}
  .res-bench-zone-bar{ position:relative;height:14px;border-radius:99px;
    background:linear-gradient(90deg,#E5484D 0%,#E5484D 44%,#F5A524 46%,#F5A524 68%,#22C55E 70%,#22C55E 100%);
    margin-bottom:30px; }
  .res-bench-marker{ position:absolute;top:50%;left:0;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;transition:left 1.5s cubic-bezier(.2,.7,.2,1); }
  .res-bench-marker-dot{ width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #fff;
    box-shadow:0 0 0 4px rgba(255,255,255,.22);transition:background 1s ease,border-color 1s ease; }
  .res-bench-marker-you{ position:absolute;top:26px;font-size:11px;font-weight:700;color:#fff;
    background:rgba(255,255,255,.15);padding:2px 8px;border-radius:99px;white-space:nowrap; }
  .res-bench-peer{ position:absolute;top:50%;left:0;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;transition:left 1.7s cubic-bezier(.2,.7,.2,1);pointer-events:none; }
  .res-bench-peer-label{ position:absolute;bottom:calc(100% + 5px);font-size:10px;font-weight:700;color:#fff;
    background:rgba(255,255,255,.15);padding:2px 7px;border-radius:99px;white-space:nowrap; }
  .res-bench-peer-dot{ width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    font-size:10px;font-weight:800;color:#fff;border:2.5px solid rgba(14,42,71,.6); }
  .res-bench-peer-a .res-bench-peer-dot{background:linear-gradient(135deg,#22C55E,#16a34a);}
  .res-bench-peer-b .res-bench-peer-dot{background:linear-gradient(135deg,#a78bfa,#7c3aed);}
  .res-bench-zone-labels{ display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase; }
  .res-bench-zone-labels span:nth-child(1){color:#E5484D;}
  .res-bench-zone-labels span:nth-child(2){color:#F5A524;}
  .res-bench-zone-labels span:nth-child(3){color:#22C55E;}
  .res-bench-verdict{ display:inline-block;font-size:13px;font-weight:700;padding:5px 14px;border-radius:99px;margin-bottom:10px; }
  .res-bench-sub{font-size:13px;color:#9fb0c9;margin-bottom:16px;}

  /* tiny test control bar (NOT part of page 6 — just so you can try roles/scores) */
  .ctl{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:22px;box-shadow:var(--shadow);}
  .ctl label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:5px;}
  .ctl-row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;}
  .ctl input{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit;}
  .ctl .role{flex:1;min-width:170px;}
  .ctl .score{width:90px;}
  .ctl button{background:var(--rise);color:#fff;border:0;border-radius:9px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
<div class="brand">Hir<span class="ed">ED</span> · Leaderboard test</div>
<div class="wrap">
  <div class="ctl">
    <label>Try the leaderboard (hits the live /benchmark)</label>
    <div class="ctl-row">
      <div class="role"><input id="role" value="Registered Nurse" placeholder="role" /></div>
      <div><div style="font-size:11px;color:#48607f;margin-bottom:5px;">SCORE</div><input class="score" id="score" type="number" value="72" min="0" max="100" /></div>
      <button id="run">Run</button>
    </div>
  </div>

  <!-- ===== Page 6 markup, verbatim ===== -->
  <div class="rsec">
    <h2 class="rsec-title">How prepared are you, really?</h2>
    <p class="rsec-sub">Benchmarked live against everyone on HirED targeting this role.</p>
    <div class="res-bench">
      <div class="res-bench-loading" id="benchLoading">Benchmarking…</div>
      <div class="res-bench-content" id="benchContent">
        <div class="res-bench-label">Your standing</div>
        <div class="res-bench-big">Ahead of <span id="benchPct">—</span>% <span id="benchOf">of people</span></div>
        <div class="res-bench-sub" id="benchSub"></div>
        <div class="res-bench-zone-wrap">
          <div class="res-bench-zone-bar">
            <div class="res-bench-peer res-bench-peer-a" id="benchPeerA">
              <div class="res-bench-peer-label" id="benchPeerALabel"></div>
              <div class="res-bench-peer-dot">ML</div>
            </div>
            <div class="res-bench-peer res-bench-peer-b" id="benchPeerB">
              <div class="res-bench-peer-label" id="benchPeerBLabel"></div>
              <div class="res-bench-peer-dot">JR</div>
            </div>
            <div class="res-bench-marker" id="benchMarker">
              <div class="res-bench-marker-dot" id="benchDot"></div>
              <div class="res-bench-marker-you">You</div>
            </div>
          </div>
          <div class="res-bench-zone-labels"><span>Needs Work</span><span>Improving</span><span>Green Zone</span></div>
        </div>
        <div class="res-bench-verdict" id="benchVerdict"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE = "";  // same origin (served by the backend)
const USER_ID = "leaderboard-demo-user";
const $ = (id) => document.getElementById(id);

async function loadBenchmark(){
  const role = $("role").value.trim() || "Registered Nurse";
  const score = parseInt($("score").value, 10) || 0;
  $("benchLoading").style.display = "block"; $("benchLoading").textContent = "Benchmarking…";
  $("benchContent").style.display = "none";
  try{
    const r = await fetch(`${API_BASE}/benchmark`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ score, user_id: USER_ID, target: { value: role, type: "role" } })
    });
    if(!r.ok) throw 0;
    paintBenchmark(await r.json(), role);
  }catch{ $("benchLoading").textContent = "Benchmark unavailable — is the backend running?"; }
}

function paintBenchmark(b, role){
  $("benchLoading").style.display = "none";
  $("benchContent").style.display = "block";
  const pct = b.percentile, n = b.sample_size;
  const markerPos = Math.max(3, Math.min(97, pct));
  const isRed = pct < 45, isYellow = pct >= 45 && pct < 70;
  const zoneColor = isRed ? "#E5484D" : isYellow ? "#F5A524" : "#22C55E";
  const zoneLabel = isRed ? "Needs Work" : isYellow ? "Slight Improvement" : "Green Zone";

  $("benchPct").textContent = pct;
  $("benchPct").style.color = zoneColor;
  // THE LEADERBOARD HEADLINE: "of N people targeting <role>"
  $("benchOf").textContent = `of ${n} people`;
  $("benchSub").textContent = `Your live rank among everyone on HirED targeting ${role} — a Redis leaderboard that grows as more people join.`;

  const dot = $("benchDot");
  if(dot){ dot.style.background = zoneColor; dot.style.borderColor = zoneColor; }
  setTimeout(() => { $("benchMarker").style.left = markerPos + "%"; }, 60);

  const seed = pct * 7 % 10;
  const aheadPct = Math.min(96, pct + 10 + seed), behindPct = Math.max(4, pct - 9 - (seed % 6));
  setTimeout(() => { $("benchPeerA").style.left = Math.max(3,Math.min(97,aheadPct)) + "%"; $("benchPeerB").style.left = Math.max(3,Math.min(97,behindPct)) + "%"; }, 80);
  $("benchPeerALabel").textContent = aheadPct + "%";
  $("benchPeerBLabel").textContent = behindPct + "%";

  const v = $("benchVerdict");
  v.textContent = zoneLabel; v.style.color = zoneColor; v.style.background = zoneColor + "22";
}

$("run").onclick = loadBenchmark;
loadBenchmark();
</script>
</body>
</html>
