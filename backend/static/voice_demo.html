<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HirED — Voice Coach</title>
<style>
  :root { --ink:#0f172a; --muted:#94a3b8; --accent:#5b8cff; --gold:#f5b54a; --good:#34d399; --bad:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#e8eefc; background:radial-gradient(1200px 700px at 50% -10%, #1c2540 0%, #0b0f1d 55%, #070a14 100%); min-height:100vh; }
  .wrap { max-width:720px; margin:0 auto; padding:26px 20px 60px; }
  h1 { margin:0; font-size:26px; letter-spacing:.2px; } h1 b { color:var(--gold); }
  .sub { color:var(--muted); margin:4px 0 18px; font-size:14px; }
  .card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); border-radius:18px; padding:18px; margin-bottom:16px; backdrop-filter: blur(6px); }
  label { font-size:12px; color:var(--muted); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:.6px; }
  input { width:100%; padding:11px 13px; border:1px solid rgba(255,255,255,.12); border-radius:11px; font-size:15px; background:rgba(0,0,0,.25); color:#e8eefc; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button { border:0; border-radius:12px; padding:12px 20px; font-size:15px; font-weight:650; cursor:pointer; transition:transform .08s, filter .15s; }
  button:active { transform:scale(.97); }
  .primary { background:linear-gradient(135deg,var(--accent),#8a6bff); color:#fff; box-shadow:0 6px 22px rgba(91,140,255,.4); }
  .primary:disabled { opacity:.4; cursor:not-allowed; box-shadow:none; }
  .ghost { background:rgba(255,255,255,.08); color:#cdd8f5; }
  .danger { background:rgba(248,113,113,.16); color:var(--bad); }
  .hint { font-size:13px; color:var(--muted); margin:8px 0 0; }
  /* Hero orb */
  .stage { display:flex; flex-direction:column; align-items:center; padding:6px 0 4px; }
  canvas#orb { width:300px; height:300px; }
  .state { margin-top:2px; font-size:15px; color:#c7d2f0; min-height:22px; font-weight:600; letter-spacing:.3px; }
  /* transcript */
  #transcript { display:flex; flex-direction:column; gap:8px; max-height:280px; overflow:auto; margin-top:6px; }
  .turn { padding:9px 13px; border-radius:13px; max-width:86%; font-size:15px; line-height:1.35; }
  .user { align-self:flex-end; background:linear-gradient(135deg,var(--accent),#6d7bff); color:#fff; border-bottom-right-radius:4px; }
  .assistant { align-self:flex-start; background:rgba(255,255,255,.08); color:#e8eefc; border-bottom-left-radius:4px; }
  .empty { color:var(--muted); font-style:italic; }
  #log { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:#6b7794; white-space:pre-wrap; margin-top:12px; max-height:120px; overflow:auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>HirED <b>Voice Coach</b></h1>
  <p class="sub">Talk to the AI career coach — it knows your résumé and remembers your past conversations.</p>

  <div class="card">
    <div class="stage">
      <canvas id="orb" width="600" height="600"></canvas>
      <div class="state" id="state">tap “Talk to coach” to begin</div>
    </div>
    <div class="row" style="justify-content:center; margin-top:8px;">
      <button class="primary" id="talkBtn">🎙️ Talk to coach</button>
      <button class="danger" id="stopBtn" disabled>■ Stop</button>
      <button class="ghost" id="narrateBtn">🔊 Hear a sample</button>
    </div>
  </div>

  <div class="card">
    <label>Your user ID</label>
    <div class="row">
      <input id="userId" value="demo-voice-user" />
      <button class="ghost" id="seedBtn">Create sample profile</button>
    </div>
    <p class="hint" id="profileHint">Click “Create sample profile” once so the coach has a score + gaps to coach you on.</p>
  </div>

  <div class="card">
    <div id="transcript"><span class="empty">Your conversation will appear here…</span></div>
  </div>

  <div id="log"></div>
</div>

<script>
const API = "";
const WS_FALLBACK = "wss://agent.deepgram.com/v1/agent/converse";
const AGENT_OUTPUT_RATE = 24000, MIC_RATE = 16000;

const $ = (id) => document.getElementById(id);
const log = (m) => { $("log").textContent += m + "\n"; $("log").scrollTop = 1e9; };
const setState = (t) => { $("state").textContent = t; };
function addTurn(role, text) {
  const t = $("transcript"); if (t.querySelector(".empty")) t.innerHTML = "";
  const d = document.createElement("div"); d.className = "turn " + (role === "user" ? "user" : "assistant");
  d.textContent = text; t.appendChild(d); t.scrollTop = 1e9;
}

let ws, audioCtx, micStream, micNode, playHead = 0, running = false, audioChunks = 0;
let micAnalyser, outAnalyser, displayAmp = 0, speaking = false;

/* ---------------- the orb (Siri-style morphing glow) ---------------- */
const canvas = $("orb"), g2 = canvas.getContext("2d");
function analyserLevel(an) {
  if (!an) return 0;
  an.getByteFrequencyData(an._buf);
  let s = 0; for (const v of an._buf) s += v; return (s / an._buf.length) / 255;
}
function freqAt(an, frac) { if (!an) return 0; const i = Math.floor(frac * an._buf.length); return (an._buf[i] || 0) / 255; }
function drawOrb() {
  requestAnimationFrame(drawOrb);
  const W = canvas.width, H = canvas.height, cx = W / 2, cy = H / 2;
  g2.clearRect(0, 0, W, H);
  const micA = running ? analyserLevel(micAnalyser) : 0;
  const outA = running ? analyserLevel(outAnalyser) : 0;
  speaking = outA > micA + 0.01;
  const t = performance.now() / 1000;
  const target = running ? Math.max(micA, outA, 0.02) : 0.05 + 0.03 * Math.sin(t * 1.6);
  displayAmp += (target - displayAmp) * 0.14;

  const an = speaking ? outAnalyser : micAnalyser;
  const col = speaking ? [245, 181, 74] : [91, 140, 255];          // gold vs blue
  const baseR = Math.min(W, H) * 0.17;
  const amp = baseR * (0.5 + displayAmp * 2.4);

  // outer glow halo
  const halo = g2.createRadialGradient(cx, cy, baseR * 0.4, cx, cy, baseR + amp * 1.7);
  halo.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},0.30)`);
  halo.addColorStop(1, "rgba(0,0,0,0)");
  g2.fillStyle = halo; g2.fillRect(0, 0, W, H);

  // morphing blob
  const N = 110;
  g2.beginPath();
  for (let i = 0; i <= N; i++) {
    const ang = (i / N) * Math.PI * 2;
    const f = freqAt(an, (i % N) / N);
    const wob = Math.sin(ang * 3 + t * 1.4) * 0.05 + Math.sin(ang * 6 - t * 1.05) * 0.035 + Math.sin(ang * 2 + t * .7) * 0.04;
    const r = baseR + amp * (0.35 + f * 1.1) + baseR * wob;
    const x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
    i === 0 ? g2.moveTo(x, y) : g2.lineTo(x, y);
  }
  g2.closePath();
  const fill = g2.createRadialGradient(cx, cy - amp * .2, baseR * 0.25, cx, cy, baseR + amp);
  fill.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},0.95)`);
  fill.addColorStop(0.6, `rgba(${col[0]},${col[1]},${col[2]},0.55)`);
  fill.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0.08)`);
  g2.save(); g2.shadowColor = `rgb(${col[0]},${col[1]},${col[2]})`; g2.shadowBlur = 60 + displayAmp * 120;
  g2.fillStyle = fill; g2.fill(); g2.restore();

  // bright core
  const core = g2.createRadialGradient(cx, cy, 0, cx, cy, baseR * (0.6 + displayAmp));
  core.addColorStop(0, "rgba(255,255,255,0.9)");
  core.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
  g2.fillStyle = core; g2.beginPath(); g2.arc(cx, cy, baseR * (0.6 + displayAmp), 0, 7); g2.fill();
}
drawOrb();  // idle breathing from page load

/* ---------------- sample profile ---------------- */
$("seedBtn").onclick = async () => {
  const uid = $("userId").value.trim() || "demo-voice-user";
  setState("scoring a sample résumé…");
  const fd = new FormData();
  fd.append("user_id", uid);
  fd.append("target", JSON.stringify({ type: "role", value: "Registered Nurse" }));
  fd.append("resume_text", "Certified Nursing Assistant, 3 years at a skilled nursing facility. CPR certified. Helped 20+ patients daily with care plans. Studying prerequisites. No RN license yet.");
  try {
    const j = await (await fetch(API + "/score", { method: "POST", body: fd })).json();
    $("profileHint").textContent = `✓ Ready — readiness ${j.score}/100, target Registered Nurse. Now tap “Talk to coach”.`;
    setState("profile ready — tap “Talk to coach”");
  } catch (e) { log("seed error: " + e.message); }
};

/* ---------------- narration fallback (also drives the orb) ---------------- */
$("narrateBtn").onclick = async () => {
  try {
    setState("synthesizing…");
    const j = await (await fetch(API + "/narrate", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: "Hi! I'm your HirED career coach. You're closer than you think — let's close your gaps one small step at a time." }) })).json();
    if (!j.audio_url) throw new Error(j.note || "no audio");
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
    const el = new Audio(API + j.audio_url); el.crossOrigin = "anonymous";
    outAnalyser = audioCtx.createAnalyser(); outAnalyser.fftSize = 256; outAnalyser._buf = new Uint8Array(outAnalyser.frequencyBinCount);
    const srcN = audioCtx.createMediaElementSource(el); srcN.connect(outAnalyser); outAnalyser.connect(audioCtx.destination);
    running = true; setState("coach speaking…");
    el.onended = () => { running = false; setState("tap “Talk to coach” to begin"); };
    await el.play();
  } catch (e) { log("narrate error: " + e.message); }
};

/* ---------------- live agent ---------------- */
$("talkBtn").onclick = startAgent;
$("stopBtn").onclick = stopAgent;

async function startAgent() {
  const uid = $("userId").value.trim() || "demo-voice-user";
  $("talkBtn").disabled = true; setState("connecting…");
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();  // unlock under the gesture
  audioCtx.resume();
  outAnalyser = audioCtx.createAnalyser(); outAnalyser.fftSize = 256; outAnalyser._buf = new Uint8Array(outAnalyser.frequencyBinCount);
  outAnalyser.connect(audioCtx.destination);
  log("audio: " + audioCtx.state + " @ " + audioCtx.sampleRate + "Hz");

  let cfg;
  try { cfg = await (await fetch(API + "/voice-agent/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user_id: uid }) })).json(); }
  catch (e) { log("config error: " + e.message); return fail(); }
  if (!cfg.configured) { log("voice agent not configured: " + (cfg.note || "")); return fail(); }
  if (cfg.remembered_turns) log(`memory: folding ${cfg.remembered_turns} past turn(s) into the prompt`);

  try { micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { log("microphone denied: " + e.message); return fail(); }

  ws = new WebSocket(cfg.ws_url || WS_FALLBACK, ["bearer", cfg.token]);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => log("ws open");
  ws.onerror = () => log("ws error (often auth)");
  ws.onclose = (e) => { log("ws closed (" + e.code + ")"); if (running) stopAgent(); };
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === "Welcome") {
        log("Welcome ✓ — sending Settings"); ws.send(JSON.stringify(cfg.settings)); startMic();
        running = true; $("stopBtn").disabled = false; setState("listening — start talking");
        if (cfg.greeting) addTurn("assistant", cfg.greeting);
        setInterval(() => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "KeepAlive" })); }, 5000);
      } else if (m.type === "ConversationText") {
        addTurn(m.role, m.content);
        fetch(API + "/voice-agent/memory", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user_id: uid, role: m.role, content: m.content }) }).catch(() => {});
      } else if (m.type === "UserStartedSpeaking") { playHead = audioCtx ? audioCtx.currentTime : 0; setState("listening…"); }
      else if (m.type === "AgentAudioDone") { setState("listening — your turn"); }
      else if (m.type === "Error" || m.type === "Warning") { log("agent " + m.type.toLowerCase() + ": " + (m.description || m.message || "")); }
      else { log("msg: " + m.type); }
    } else { playPCM(ev.data); }
  };
  function fail() { $("talkBtn").disabled = false; setState("error — see log below"); }
}

function startMic() {
  const src = audioCtx.createMediaStreamSource(micStream);
  micAnalyser = audioCtx.createAnalyser(); micAnalyser.fftSize = 256; micAnalyser._buf = new Uint8Array(micAnalyser.frequencyBinCount);
  src.connect(micAnalyser);
  micNode = audioCtx.createScriptProcessor(4096, 1, 1);
  const ratio = audioCtx.sampleRate / MIC_RATE;
  src.connect(micNode); micNode.connect(audioCtx.destination);
  micNode.onaudioprocess = (e) => {
    if (!ws || ws.readyState !== 1) return;
    const input = e.inputBuffer.getChannelData(0), outLen = Math.floor(input.length / ratio), pcm = new Int16Array(outLen);
    for (let i = 0; i < outLen; i++) { const s = Math.max(-1, Math.min(1, input[Math.floor(i * ratio)])); pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff; }
    ws.send(pcm.buffer);
  };
  playHead = audioCtx.currentTime;
}

function playPCM(buf) {
  if (!audioCtx) return;
  if (audioCtx.state === "suspended") audioCtx.resume();
  if (audioChunks++ === 0) log("receiving agent audio ✓");
  const pcm = new Int16Array(buf), f32 = new Float32Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) f32[i] = pcm[i] / 0x8000;
  const ab = audioCtx.createBuffer(1, f32.length, AGENT_OUTPUT_RATE); ab.copyToChannel(f32, 0);
  const node = audioCtx.createBufferSource(); node.buffer = ab; node.connect(outAnalyser);  // -> analyser -> destination
  const now = audioCtx.currentTime; if (playHead < now) playHead = now;
  node.start(playHead); playHead += ab.duration; setState("coach speaking…");
}

function stopAgent() {
  running = false;
  try { ws && ws.close(); } catch {}
  try { micNode && micNode.disconnect(); } catch {}
  try { micStream && micStream.getTracks().forEach((t) => t.stop()); } catch {}
  $("talkBtn").disabled = false; $("stopBtn").disabled = true; setState("stopped");
  log("session ended");
}
</script>
</body>
</html>
